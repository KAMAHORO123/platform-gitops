# Every change to the GitOps repo: build every apps/<app>/envs/<env> with
# Kustomize and check the result, plus infra/ and bootstrap/argo-config/,
# against the Kubernetes and CRD schemas. A broken overlay cannot reach main,
# so Argo CD never receives something it cannot apply.

name: Validate config

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build every app x environment with Kustomize
        run: |
          mkdir -p rendered
          for dir in apps/*/envs/*/; do
            dir=${dir%/}; app=$(echo "$dir" | cut -d/ -f2); env=$(basename "$dir")
            echo "::group::$app / $env"
            kubectl kustomize "$dir" | tee "rendered/$app-$env.yaml" | grep -E '^kind:|image:' || true
            echo "::endgroup::"
          done
      - name: Check against Kubernetes and CRD schemas (kubeconform)
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$KUBECONFORM_IMAGE" \
            -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered infra bootstrap/argo-config bootstrap/optional bootstrap/argocd/root-app.yaml
