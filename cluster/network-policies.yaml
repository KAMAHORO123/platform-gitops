# Zero-trust networking per environment (proposal 3, objective 6). Without
# policies every pod can reach every other pod, even UAT -> production.
# Here everything is denied, then only what the apps need is opened:
#   ingress controller -> app pods          (web traffic)
#   pods -> cluster DNS                      (name lookups)
#   pods labelled database-access -> PostgreSQL 192.168.58.50:5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: uat
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-controller
  namespace: uat
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: uat
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database
  namespace: uat
spec:
  podSelector:
    matchLabels:
      rssb.rw/database-access: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.58.50/32
      ports:
        - { protocol: TCP, port: 5432 }
---
