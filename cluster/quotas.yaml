# Per-environment ceilings (proposal 3, objective 5). A quota caps what one
# environment can reserve, so a runaway UAT test can never starve production.
# Every container must then declare requests/limits; the LimitRange fills in
# defaults for any that forget.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment-quota
  namespace: uat
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: uat
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
      max: { memory: 1Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: staging
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
      max: { memory: 1Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment-quota
  namespace: production
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.memory: 6Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: production
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
      max: { memory: 1Gi }
