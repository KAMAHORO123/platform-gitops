# OPTIONAL: Prometheus + Grafana + Alertmanager (lab stand-in for New Relic, plan D20).
# Not applied by the root app. Switch with infra-automation/monitoring.sh on|off:
#   on  -> kubectl apply -f bootstrap/optional/monitoring.yaml
#   off -> kubectl delete application monitoring -n argocd   (finalizer removes all it installed)
# On a 16 GB laptop, monitoring + three environments exhausted the Docker VM
# (load 116+, API timeouts), so it runs only when the dashboards are being shown.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  # Deleting this Application removes everything it installed (switch off).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1
    helm:
      releaseName: monitoring
      valuesObject:
        fullnameOverride: monitoring
        # minikube binds these control-plane components to localhost, so they
        # cannot be scraped; leaving them on only produces false alerts.
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 900Mi }
            # Pick up ServiceMonitors / rules from every namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 96Mi }
        grafana:
          defaultDashboardsTimezone: Africa/Kigali
          # Never let the chart generate the password: Helm's randAlphaNum runs
          # on every Argo CD render, changing the Secret each time (permanent
          # OutOfSync, and a password that no longer matches Grafana's).
          admin:
            existingSecret: grafana-admin          # infra/monitoring/grafana-admin.sealed.yaml
            userKey: admin-user
            passwordKey: admin-password
          # 256Mi was a guess and Grafana 13 was OOMKilled while starting;
          # sized from observation instead.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          # Grafana 13 starts slowly on a busy laptop: give it time before the
          # liveness probe judges it. (A Recreate strategy was tried and dropped:
          # server-side apply merged it with the live rollingUpdate defaults,
          # which Kubernetes rejects.)
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the Prometheus CRDs are too large for client-side apply