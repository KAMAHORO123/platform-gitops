# Platform add-ons installed from public Helm charts, pinned, values in Git.
#   vpa: Vertical Pod Autoscaler in advice-only mode (plan 5.3)
# Monitoring (Prometheus + Grafana) lives in bootstrap/optional/ and is switched
# on/off with infra-automation/monitoring.sh (the lab laptop cannot run it all day).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 5.1.0
    helm:
      releaseName: vpa
      valuesObject:
        # Advice only: the recommender measures and suggests requests; nothing
        # resizes or restarts pods automatically.
        recommender:
          enabled: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        updater: { enabled: false }
        admissionController: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
