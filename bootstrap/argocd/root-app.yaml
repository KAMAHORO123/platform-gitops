# The single object applied by hand (plan 6.2 stage 4). Argo CD reads
# bootstrap/argo-config and builds everything else from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KAMAHORO123/platform-gitops.git
    targetRevision: main
    path: bootstrap/argo-config
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
