apiVersion: apps/v1
kind: Deployment
metadata:
  name: rssb-pilot-backend
  labels:
    app.kubernetes.io/name: rssb-pilot-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: rssb-pilot-backend   # never change: selectors are immutable
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # never drop below the desired count during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rssb-pilot-backend
        rssb.rw/database-access: "true"   # NetworkPolicy lets only these pods reach PostgreSQL
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread copies across nodes so one node failure is survivable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rssb-pilot-backend
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/kamahoro123/rssb-pilot-app/backend   # digest set per environment
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: rssb-pilot-backend-config
            - secretRef:
                name: backend-secrets            # sealed, per environment
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:          # stuck process -> restart it
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:         # database unreachable -> stop sending traffic here
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:              # keep serving until the ingress stops routing here
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
