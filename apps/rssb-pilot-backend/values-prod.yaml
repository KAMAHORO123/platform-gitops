# rssb-pilot-backend in production.
image:
  tag: tree-72ba26ba4421   # changed only through a reviewed PR (CI opens it on merge to main)

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  host: prod.127.0.0.1.nip.io

env:
  ALLOWED_ORIGINS: http://prod.127.0.0.1.nip.io:8081

migration:
  seed: false   # never load demo data into production
