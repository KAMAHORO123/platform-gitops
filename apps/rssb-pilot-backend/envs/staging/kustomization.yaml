# rssb-pilot-backend in staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - backend-secrets.sealed.yaml

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/backend
    digest: sha256:b3b9c380307c7c5727b6629d8ef44cbec3646f83dc13c4cf5367e8118c1cd207
  - name: ghcr.io/kamahoro123/rssb-pilot-app/backend-migrator
    digest: sha256:5d2a70dc320ba0a0125c538dbfc18827ce58dda48a1df7deee4c7a75972d0823

configMapGenerator:
  - name: rssb-pilot-backend-config
    behavior: merge
    literals:
      - ALLOWED_ORIGINS=http://staging.127.0.0.1.nip.io:8081

patches:
  - target: { kind: Ingress, name: rssb-pilot-backend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.127.0.0.1.nip.io
  - target: { kind: Job, name: rssb-pilot-backend-migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "true"
