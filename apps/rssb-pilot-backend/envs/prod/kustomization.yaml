# rssb-pilot-backend in production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - backend-secrets.sealed.yaml
  - hpa.yaml
  - pdb.yaml

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/backend
    digest: sha256:d5d3cca681184d6d4966307ae0cd619523c4e717cf17544163d3c78fa083545d
  - name: ghcr.io/kamahoro123/rssb-pilot-app/backend-migrator
    digest: sha256:d2f173ae27188206da5fb9386721b69e1ee4e10c34472635a5cc9e92939cc12c

configMapGenerator:
  - name: rssb-pilot-backend-config
    behavior: merge
    literals:
      - ALLOWED_ORIGINS=http://prod.127.0.0.1.nip.io:8081

patches:
  - target: { kind: Ingress, name: rssb-pilot-backend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod.127.0.0.1.nip.io
  - target: { kind: Job, name: rssb-pilot-backend-migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "false"
  # The HPA owns the replica count in production; Git must not fight it.
  - target: { kind: Deployment, name: rssb-pilot-backend }
    patch: |-
      - op: remove
        path: /spec/replicas
