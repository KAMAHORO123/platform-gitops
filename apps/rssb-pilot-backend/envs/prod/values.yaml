# rssb-pilot-backend in production. Layered on ../../values.yaml.

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/backend
    digest: sha256:b3b9c380307c7c5727b6629d8ef44cbec3646f83dc13c4cf5367e8118c1cd207
  - name: ghcr.io/kamahoro123/rssb-pilot-app/backend-migrator
    digest: sha256:5d2a70dc320ba0a0125c538dbfc18827ce58dda48a1df7deee4c7a75972d0823

ingress:
  host: prod.127.0.0.1.nip.io

config:
  ALLOWED_ORIGINS: http://prod.127.0.0.1.nip.io:8081

# The HPA owns the replica count in production; Git must not fight it.
autoscaling:
  enabled: true
podDisruptionBudget:
  enabled: true

migration:
  seed: false   # demo data: never in production

# Encrypted with the cluster's public key: only the cluster can read it.
sealedSecrets:
  backend-secrets:
    DATABASE_URL: 
    JWT_SECRET: 
