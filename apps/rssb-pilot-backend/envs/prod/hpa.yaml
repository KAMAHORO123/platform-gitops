apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rssb-pilot-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rssb-pilot-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
