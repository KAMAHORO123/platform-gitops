# rssb-pilot-backend (NestJS API): settings shared by every environment.
image:
  repository: ghcr.io/kamahoro123/rssb-pilot-app/backend

containerPort: 3001
existingSecret: backend-secrets   # DATABASE_URL, JWT_SECRET (Sealed Secret per namespace)

env:
  PORT: "3001"
  JWT_ISSUER: smart-logistics
  JWT_AUDIENCE: smart-logistics-web

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

startupProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 3
  failureThreshold: 40
livenessProbe:          # stuck process -> restart it
  httpGet: { path: /health, port: http }
  periodSeconds: 10
readinessProbe:         # database unreachable -> stop sending traffic here
  httpGet: { path: /health/readiness, port: http }
  periodSeconds: 5

# Browser calls /api/* on the same hostname; the prefix is stripped here.
ingress:
  enabled: true
  path: /api(/|$)(.*)
  pathType: ImplementationSpecific
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

migration:
  enabled: true
  image:
    repository: ghcr.io/kamahoro123/rssb-pilot-app/backend-migrator
