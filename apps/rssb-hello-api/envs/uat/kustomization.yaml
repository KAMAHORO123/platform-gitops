# rssb-hello-api in uat.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uat
resources:
  - ../../base

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-hello-api
    digest: sha256:ade540e0a1f406efc03f590d825e4772109360ebb16f821f7b9f543edf182402

patches:
  - target: { kind: Ingress, name: rssb-hello-api }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rssb-hello-api-uat.127.0.0.1.nip.io
