# rssb-hello-api in production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

# Not released to production yet: CI writes the digest when it is promoted.
images:
  - name: ghcr.io/kamahoro123/rssb-hello-api
    newTag: not-released

patches:
  - target: { kind: Ingress, name: rssb-hello-api }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rssb-hello-api-prod.127.0.0.1.nip.io
  # The HPA owns the replica count in production; Git must not fight it.
  - target: { kind: Deployment, name: rssb-hello-api }
    patch: |-
      - op: remove
        path: /spec/replicas
