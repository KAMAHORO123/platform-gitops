# rssb-hello-api (nestjs): settings shared by every environment. Generated by rssb-infra/onboard.
image:
  repository: ghcr.io/kamahoro123/rssb-hello-api

containerPort: 3000

livenessProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 5

ingress:
  enabled: true
  path: /
  pathType: Prefix
