# rssb-pilot-frontend in staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/frontend
    digest: sha256:2ee31bbc76f81348563a7fab974484cfcda898045c95cd741b2a0d84f1f00578

patches:
  - target: { kind: Ingress, name: rssb-pilot-frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.127.0.0.1.nip.io
