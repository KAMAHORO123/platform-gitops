# rssb-pilot-frontend in production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/frontend
    digest: sha256:67ff8c0260330711d2e72cb4635e9c19119db28acb0693a6fb524cca3969749e

patches:
  - target: { kind: Ingress, name: rssb-pilot-frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod.127.0.0.1.nip.io
  # The HPA owns the replica count in production; Git must not fight it.
  - target: { kind: Deployment, name: rssb-pilot-frontend }
    patch: |-
      - op: remove
        path: /spec/replicas
