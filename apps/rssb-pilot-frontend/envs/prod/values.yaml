# rssb-pilot-frontend in production. Layered on ../../values.yaml.

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/frontend
    digest: sha256:8908d048c53dc19d0f541902582397c041f7eb15c08788f338c6ab650b4244ce

ingress:
  host: prod.127.0.0.1.nip.io

# The HPA owns the replica count in production; Git must not fight it.
autoscaling:
  enabled: true
podDisruptionBudget:
  enabled: true
