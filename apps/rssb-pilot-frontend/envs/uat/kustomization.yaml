# rssb-pilot-frontend in uat.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uat
resources:
  - ../../base

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/frontend
    digest: sha256:8908d048c53dc19d0f541902582397c041f7eb15c08788f338c6ab650b4244ce

patches:
  - target: { kind: Ingress, name: rssb-pilot-frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: uat.127.0.0.1.nip.io
