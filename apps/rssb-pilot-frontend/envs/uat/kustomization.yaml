# rssb-pilot-frontend in uat.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uat
resources:
  - ../../base

# The ONLY lines CI changes: which exact image bytes run here.
images:
  - name: ghcr.io/kamahoro123/rssb-pilot-app/frontend
    digest: sha256:1683f695d8aad54a0657a29b0f40791ee5ecb63c6d564fad453052cf79c4af3e

patches:
  - target: { kind: Ingress, name: rssb-pilot-frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: uat.127.0.0.1.nip.io
