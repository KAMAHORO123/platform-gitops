apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rssb-pilot-frontend
  labels:
    app.kubernetes.io/name: rssb-pilot-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: HOST_SET_PER_ENVIRONMENT
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rssb-pilot-frontend
                port: { name: http }
