{{- if .Values.migration.enabled }}
# Argo CD runs this before applying anything else (PreSync) and deletes the
# previous run first, so every sync re-checks migrations with the new image.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-migrate
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}-migrate
        {{- with (include "app.accessLabels" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ required "migration.image.repository is required" .Values.migration.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: RUN_SEED
              value: {{ .Values.migration.seed | quote }}
            - name: HOME
              value: /home/node
          {{- /* Only the Secret: the app ConfigMap is created in the Sync phase,
               AFTER this PreSync hook, so referencing it would block forever. */}}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/node }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
{{- end }}
