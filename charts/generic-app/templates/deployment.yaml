apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # never drop below the desired count during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- with (include "app.accessLabels" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        # A config change alters this hash, which rolls the pods to pick it up.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      # Spread copies across nodes so one node failure is survivable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}
      terminationGracePeriodSeconds: {{ add .Values.preStopSleepSeconds 25 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- with (include "app.envFrom" . | trim) }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml (.Values.livenessProbe | default (dict "tcpSocket" (dict "port" "http") "periodSeconds" 10)) | nindent 12 }}
          readinessProbe:
            {{- toYaml (.Values.readinessProbe | default (dict "tcpSocket" (dict "port" "http") "periodSeconds" 5)) | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- range $i, $dir := .Values.writableDirs }}
            - name: writable-{{ $i }}
              mountPath: {{ $dir }}
            {{- end }}
      volumes:
        {{- range $i, $dir := .Values.writableDirs }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
