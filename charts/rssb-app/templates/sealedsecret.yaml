{{- range $name, $data := .Values.sealedSecrets }}
---
# Decrypted inside the cluster by the Sealed Secrets controller into Secret
# {{ $name }}, before migrations and the app (wave -2).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    {{- toYaml $data | nindent 4 }}
  template:
    metadata:
      name: {{ $name }}
      namespace: {{ $.Release.Namespace }}
{{- end }}
