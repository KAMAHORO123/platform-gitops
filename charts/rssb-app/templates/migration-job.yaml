{{- if .Values.migration.enabled }}
# Database migrations, before the new version starts (plan 6.4):
#   wave -2 secrets  ->  wave -1 this Job  ->  wave 0 the app
# Argo CD waits for the Job to succeed before starting wave 0; if it fails,
# the sync stops and the old version keeps serving.
# Force+Replace: a Job's pod template is immutable, so when the image digest
# changes Argo CD deletes and recreates it (plan G5) and migrations run again.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-migrate
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}-migrate
    {{- with .Values.partOf }}
    app.kubernetes.io/part-of: {{ . }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}-migrate
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "app.image" (list . .Values.migration.image.repository) }}
          env:
            - name: RUN_SEED
              value: {{ .Values.migration.seed | quote }}
            - name: HOME
              value: /home/node
          {{- /* Only the Secret: migrations need nothing from the app config. */}}
          {{- with .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/node }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
{{- end }}
