{{- if .Values.vpa.enabled }}
# Advice only (updateMode Off): kubectl describe vpa {{ include "app.name" . }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "app.name" . }}
  updatePolicy:
    updateMode: "Off"
{{- end }}
