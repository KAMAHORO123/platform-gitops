# Platform add-ons installed from public Helm charts, pinned, values in Git.
#   monitoring: Prometheus + Grafana + Alertmanager (proposal 5.3, 4.1)
#   vpa:        Vertical Pod Autoscaler in advice-only mode (proposal 5.3)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1
    helm:
      releaseName: monitoring
      valuesObject:
        fullnameOverride: monitoring
        # minikube binds these control-plane components to localhost, so they
        # cannot be scraped; leaving them on only produces false alerts.
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 900Mi }
            # Pick up ServiceMonitors / rules from every namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 96Mi }
        grafana:
          defaultDashboardsTimezone: Africa/Kigali
          # Never let the chart generate the password: Helm's randAlphaNum runs
          # on every Argo CD render, changing the Secret each time (permanent
          # OutOfSync, and a password that no longer matches Grafana's).
          admin:
            existingSecret: grafana-admin          # sealed-secrets/grafana-admin-monitoring.yaml
            userKey: admin-user
            passwordKey: admin-password
          # 256Mi was a guess and Grafana 13 was OOMKilled while starting;
          # sized from observation instead.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          # Grafana 13 starts slowly on a busy laptop: give it time before the
          # liveness probe judges it, and never run old + new pods together
          # (two crash-looping Grafanas used ~1 CPU between them).
          deploymentStrategy:
            type: Recreate
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the Prometheus CRDs are too large for client-side apply
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 5.1.0
    helm:
      releaseName: vpa
      valuesObject:
        # Advice only: the recommender measures and suggests requests; nothing
        # resizes or restarts pods automatically.
        recommender:
          enabled: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        updater: { enabled: false }
        admissionController: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
