# One Application per app folder in production, synced MANUALLY.
# Adding an app = adding a folder under apps/ (proposal 8.3).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/KAMAHORO123/rssb-config.git
              revision: main
              directories:
                - path: apps/*
          - list:
              elements:
                - { env: prod, namespace: production }
  template:
    metadata:
      name: '{{.path.basename}}-{{.env}}'
      labels:
        rssb.rw/environment: '{{.env}}'
    spec:
      project: rssb
      source:
        repoURL: https://github.com/KAMAHORO123/rssb-config.git
        targetRevision: main
        path: charts/generic-app
        helm:
          releaseName: '{{.path.basename}}'
          valueFiles:
            - '../../{{.path.path}}/values.yaml'
            - '../../{{.path.path}}/values-{{.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # No automated sync: Argo CD shows OutOfSync and a person reviews the
      # diff and presses Sync (the manual production gate, proposal 8.4).
      syncPolicy: {}
